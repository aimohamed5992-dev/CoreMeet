<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:;" />
    <title>Choose what to share</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
        background: #12191c; color: #e8efeb; user-select: none;
      }
      header { padding: 14px 18px 8px; }
      header h1 { margin: 0; font-size: 15px; font-weight: 700; }
      header p { margin: 3px 0 0; color: #9fb0a8; font-size: 12px; }
      .tabs { display: flex; gap: 6px; padding: 8px 18px 0; }
      .tabs button {
        font: inherit; border: 0; background: transparent; color: #9fb0a8;
        padding: 6px 12px; border-radius: 8px; cursor: pointer;
      }
      .tabs button.active { background: #1e2a2e; color: #fff; }
      main {
        flex: 1; overflow-y: auto; padding: 12px 18px;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        align-content: start;
      }
      .src {
        border: 2px solid transparent; border-radius: 10px; overflow: hidden;
        background: #1a2226; cursor: pointer; text-align: left; padding: 0;
        font: inherit; color: inherit;
      }
      .src:hover { border-color: #37c66a; }
      .src img.thumb { width: 100%; height: 108px; object-fit: cover; display: block; background: #0b0f0d; }
      .src .label { display: flex; align-items: center; gap: 6px; padding: 7px 9px; }
      .src .label img { width: 15px; height: 15px; border-radius: 3px; flex: none; }
      .src .label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      footer { padding: 10px 18px; display: flex; justify-content: flex-end; border-top: 1px solid #24302f; }
      footer button {
        font: inherit; font-weight: 600; border: 1px solid #2c3a31; background: transparent;
        color: #e8efeb; padding: 7px 16px; border-radius: 9px; cursor: pointer;
      }
      .empty { grid-column: 1/-1; text-align: center; color: #9fb0a8; padding: 40px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Choose what to share</h1>
      <p>Your whole screen, or a single window.</p>
    </header>
    <div class="tabs">
      <button data-kind="screen" class="active">Screens</button>
      <button data-kind="window">Windows</button>
    </div>
    <main id="grid"></main>
    <footer><button id="cancel">Cancel</button></footer>
    <script src="picker.js"></script>
  </body>
</html>
