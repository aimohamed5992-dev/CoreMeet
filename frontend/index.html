<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1fa84c" />
    <meta name="description" content="Cloud Meet — secure, instant video meetings in your browser, built with WebRTC." />
    <title>Cloud Meet — instant video meetings</title>
    <script>
      // Apply the saved theme + language/direction before first paint.
      try {
        var t = localStorage.getItem("coremeet.theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
        var l = localStorage.getItem("coremeet.lang");
        l = l === "ar" || l === "en" ? l : "en";
        document.documentElement.setAttribute("lang", l);
        document.documentElement.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
        document.documentElement.setAttribute("dir", "ltr");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
