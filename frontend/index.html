<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1fa84c" />
    <meta name="description" content="CoreMeet — secure, instant video meetings in your browser, built with WebRTC." />
    <title>CoreMeet — instant video meetings</title>
    <script>
      // Apply the saved theme before first paint (light is the default).
      try {
        var t = localStorage.getItem("coremeet.theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
